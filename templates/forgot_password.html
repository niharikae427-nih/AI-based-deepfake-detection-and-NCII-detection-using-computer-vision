{% extends "base.html" %}
{% block title %}Forgot Password — SENTRA AI{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-6 py-16">
  <div class="w-full max-w-md glass-card ring-glow animate-fade-up">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-secondary/10 border border-secondary/30 flex items-center justify-center text-3xl mb-6">🔑</div>
    <h1 class="font-display text-2xl font-bold text-center">Forgot your password?</h1>
    <p class="text-slate-400 text-sm mt-2 text-center">Enter your email and we'll send a verification code to reset it.</p>

    <form method="POST" class="mt-8 space-y-5">
      <div>
        <label class="text-xs text-slate-400 mb-1.5 block">Email address</label>
        <input type="email" name="email" required placeholder="you@college.edu">
      </div>
      <button type="submit" class="btn-primary ripple w-full font-semibold">Send Reset Code</button>
    </form>

    <p class="text-center text-sm text-slate-400 mt-6">
      Remembered it? <a href="{{ url_for('login') }}" class="text-primary hover:underline">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
