{% extends "base.html" %}
{% block title %}Verify Email — SENTRA AI{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-6 py-16">
  <div class="w-full max-w-md glass-card ring-glow animate-fade-up text-center">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-primary/10 border border-primary/30 flex items-center justify-center text-3xl mb-6">📧</div>
    <h1 class="font-display text-2xl font-bold">Verify your email</h1>
    <p class="text-slate-400 text-sm mt-2">We've sent a 6-digit code to <span class="text-slate-200">{{ email }}</span> (shown in the demo banner above for testing).</p>

    <form method="POST" class="mt-8 space-y-5">
      <input type="text" name="otp" maxlength="6" required placeholder="••••••" class="!text-center !text-2xl tracking-[0.5em] confidence-mono">
      <button type="submit" class="btn-primary ripple w-full font-semibold">Verify &amp; Continue</button>
    </form>

    <p class="text-xs text-slate-500 mt-6">Didn't get a code? <a href="{{ url_for('register') }}" class="text-primary hover:underline">Try registering again</a>.</p>
  </div>
</div>
{% endblock %}
