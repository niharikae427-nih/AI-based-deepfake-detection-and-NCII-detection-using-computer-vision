{% extends "base.html" %}
{% block title %}Reset Password — SENTRA AI{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-6 py-16">
  <div class="w-full max-w-md glass-card ring-glow animate-fade-up">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-primary/10 border border-primary/30 flex items-center justify-center text-3xl mb-6">🔐</div>
    <h1 class="font-display text-2xl font-bold text-center">Reset your password</h1>
    <p class="text-slate-400 text-sm mt-2 text-center">Enter the code sent to <span class="text-slate-200">{{ email }}</span> and choose a new password.</p>

    <form method="POST" class="mt-8 space-y-5">
      <div>
        <label class="text-xs text-slate-400 mb-1.5 block">Verification code</label>
        <input type="text" name="otp" maxlength="6" required placeholder="••••••" class="!text-center !text-xl tracking-[0.4em] confidence-mono">
      </div>
      <div>
        <label class="text-xs text-slate-400 mb-1.5 block">New password</label>
        <input type="password" name="password" required placeholder="Create a new password">
      </div>
      <button type="submit" class="btn-primary ripple w-full font-semibold">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
