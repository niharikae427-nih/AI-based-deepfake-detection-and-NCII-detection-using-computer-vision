{% extends "base.html" %}
{% block title %}Contact — SENTRA AI{% endblock %}
{% block content %}
{% include "includes/public_nav.html" %}

<section class="pt-40 pb-24 px-6">
  <div class="max-w-2xl mx-auto text-center mb-12 animate-fade-up">
    <h1 class="font-display text-4xl font-bold">Get in touch</h1>
    <p class="text-slate-400 mt-4">Questions about the project, a partnership, or reporting an issue? Send us a message.</p>
  </div>

  <div class="max-w-xl mx-auto glass-card ring-glow animate-fade-up delay-1">
    <form method="POST" class="space-y-5">
      <div class="grid sm:grid-cols-2 gap-5">
        <div>
          <label class="text-xs text-slate-400 mb-1.5 block">Name</label>
          <input type="text" name="name" required placeholder="Your name">
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1.5 block">Email</label>
          <input type="email" name="email" required placeholder="you@example.com">
        </div>
      </div>
      <div>
        <label class="text-xs text-slate-400 mb-1.5 block">Subject</label>
        <input type="text" name="subject" placeholder="How can we help?">
      </div>
      <div>
        <label class="text-xs text-slate-400 mb-1.5 block">Message</label>
        <textarea name="message" rows="5" required placeholder="Write your message..."></textarea>
      </div>
      <button type="submit" class="btn-primary ripple w-full font-semibold">Send Message</button>
    </form>
  </div>
</section>
{% include "includes/assistant.html" %}
{% endblock %}
